[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmessages-tui"
version = "0.1.0"
description = "Terminal UI bridge for Google Messages Web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.54.0,<2",
  "textual>=3.2.0,<4",
]

[project.scripts]
gmessages-tui = "gmessages_tui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
